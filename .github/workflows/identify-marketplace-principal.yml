name: Identify Marketplace publishing principal

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identify:
    name: Resolve Azure DevOps identity
    runs-on: ubuntu-latest
    environment: marketplace-production
    steps:
      - name: Authenticate as Marketplace publishing identity
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Marketplace member resource ID
        shell: bash
        run: |
          resource_id="$(az rest \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --query id \
            --output tsv)"
          test -n "$resource_id"
          test "$resource_id" != "null"
          {
            echo '## Marketplace publishing principal'
            echo
            echo 'Add this Azure DevOps resource ID as a member of publisher `stefanpieter`:'
            echo
            printf '`%s`\n' "$resource_id"
          } >> "$GITHUB_STEP_SUMMARY"
